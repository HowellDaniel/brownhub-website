<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- GitHub Pages returns no security headers of its own, so the policy that decides
       which scripts may run travels inside the document. Only frame-ancestors cannot
       be carried this way; sw.js adds it as a header on every page it serves. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://paystack.com; img-src 'self'; connect-src 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sample of Designs and Printing pictures — BrownHub</title>
  <!-- The collection moved when the item took its real name, and the address it leaves
       behind is already in Google's index and in other people's bookmarks. So this file
       stays: it hands the visitor straight to the new page, and the canonical tells the
       crawler which address the pictures now live at, so the ranking travels with them
       instead of starting over. "follow" is what carries that signal. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.brownhub283.com/gallery/sample-of-designs-and-printing.html">
  <meta http-equiv="refresh" content="0; url=sample-of-designs-and-printing.html">
  <link rel="stylesheet" href="../css/style.css?v=183">
</head>
<body>
  <p>These pictures have moved to
    <a href="sample-of-designs-and-printing.html">Sample of Designs and Printing</a>.</p>
</body>
</html>
