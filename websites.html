<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- GitHub Pages returns no security headers of its own, so the policy that decides
       which scripts may run travels inside the document. Only frame-ancestors cannot
       be carried this way; sw.js adds it as a header on every page it serves. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://js.paystack.co; style-src 'self' https://paystack.com; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://rmvyrfqyxgupwuzxadyx.supabase.co wss://rmvyrfqyxgupwuzxadyx.supabase.co https://api.paystack.co https://formsubmit.co; frame-src 'self' https://formsubmit.co https://checkout.paystack.com https://paystack.com https://maps.google.com https://www.google.com; form-action 'self' https://formsubmit.co; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Website Design &amp; Development in Accra — BrownHub</title>
  <meta name="description" content="BrownHub designs and builds business websites, landing pages, online catalogs, booking tools and web apps in Accra. That work now lives on the studio’s home page.">
  <!-- The content has a permanent home on the front page, so this file must never be
       indexed beside it. "follow" still matters: a crawler that arrives here has to be
       able to read its way to the band that took the page over. -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#1b0b0c">
  <meta name="impact-site-verification" value="f7014f87-9393-4437-a140-1b7f4e95ebcc">
  <link rel="canonical" href="https://www.brownhub283.com/">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css?v=96">
  <script src="js/theme.js"></script>
</head>
<body>
  <main class="page-hero">
    <div class="container">
      <p class="eyebrow">Page moved</p>
      <h1>The website work now lives on the home page</h1>
      <p>Design, code, catalog, hosting and support for business websites are shown together on the BrownHub home page, in the same band as the rest of the studio’s work.</p>
      <div class="hero__actions">
        <a href="/index.html#web-software" class="btn btn--primary">Continue to the home page</a>
        <a href="/index.html#web-catalog" class="btn btn--ghost">Just the website catalog</a>

    </div>

  <script src="js/retire.js?v=1"></script>

</html>
