# Jekyll skips dot-prefixed paths on GitHub Pages, so /.well-known/ — which Apple
# Pay reads to verify this domain — has to be pulled back in explicitly.
include:
  - ".well-known"

# The repository is the deployment, so anything left in the build is published at
# a public URL. These hold server-side source: the Edge Functions read their
# secrets from Deno.env but their request-signing and origin rules are plain text,
# and sql/supabase-schema.sql hands out the table and row-level-security layout.
# tools/ is the Swift that draws images/qr-app.png — nothing on a page links to it.
# ads/ is the display-ad kit uploaded to Google and Meta; the networks hold their
# own copy, so serving a second one from this domain would only add weight.
# The trailing slash is load-bearing: the Pages build matches a bare directory name
# as a substring of the path, so "ads" also swallowed the root ads.txt — which
# AdSense reads to verify the domain, and which 404ed until it was written here.
# None of it is ever linked from a page, so the site loses nothing by not shipping
# it — and an attacker loses the map of it.
exclude:
  - "supabase"
  - "sql"
  - "mobile"
  - "tools"
  - "ads/"
