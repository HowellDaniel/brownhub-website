        <form class="contact-form" id="contact-form" novalidate>
          <div class="form-row">
            <div class="form-field">
              <label for="name">Full name *</label>
              <input type="text" id="name" name="name" required autocomplete="name" placeholder="Jane Smith">
            </div>
            <div class="form-field">
              <label for="email">Email address *</label>
              <input type="email" id="email" name="email" required autocomplete="email" placeholder="jane@company.com">
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="company">Company / brand</label>
              <input type="text" id="company" name="company" autocomplete="organization" placeholder="Acme Inc.">
            </div>
            <div class="form-field">
              <label for="service">Service needed</label>
              <select id="service" name="service">
                <option value="">Select a service…</option>
                <option>Website Design</option>
                <option>Website Development</option>
                <option>Product Engineering</option>
                <option>Cloud &amp; DevOps</option>
                <option>AI &amp; Data</option>
                <option>UX &amp; Product Design</option>
                <option>Graphic Designing</option>
                <option>Something else</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="timeline">Preferred timeline</label>
              <select id="timeline" name="timeline">
                <option value="">Select a timeline…</option>
                <option>As soon as possible</option>
                <option>Within 1 month</option>
                <option>1–3 months</option>
                <option>3–6 months</option>
                <option>I'm flexible</option>
              </select>
            </div>
            <div class="form-field">
              <label for="budget">Estimated budget</label>
              <select id="budget" name="budget">
                <option value="">Select a budget range…</option>
                <option>Under $500</option>
                <option>$500–$2,000</option>
                <option>$2,000–$5,000</option>
                <option>$5,000–$10,000</option>
                <option>Over $10,000</option>
                <option>Not sure yet</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="stage">Project stage</label>
              <select id="stage" name="stage">
                <option value="">Select your stage…</option>
                <option>Idea only</option>
                <option>Planning / research</option>
                <option>Need design</option>
                <option>Need full website build</option>
                <option>Need improvements to an existing site</option>
                <option>Already have something and need support</option>
              </select>
            </div>
            <div class="form-field">
              <label for="references">Reference links (optional)</label>
              <input type="url" id="references" name="references" placeholder="https://example.com or portfolio link">
            </div>
          </div>

          <div class="form-field">
            <label for="message">Project details *</label>
            <textarea id="message" name="message" rows="7" required minlength="20" placeholder="Tell us about your goals, target audience, features, timeline, budget, and any inspiration or references you have…"></textarea>
            <small class="form-help">The more details you share, the better we can prepare a suitable solution for you.</small>
          </div>

          <button type="submit" class="btn btn--primary btn--lg btn--block">Send inquiry</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
