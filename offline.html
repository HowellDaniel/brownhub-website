<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Offline — BrownHub</title>
  <meta name="description" content="You are offline. BrownHub is a graphic design studio in Accra: logos, branding, flyers, banners, books and print.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1b0b0c">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BrownHub">
  <style>
    /* Self-contained on purpose: this page has to render with no network at all,
       so it cannot depend on the stylesheet being in cache. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
      background: #1b0b0c; color: #fffbf7;
      font: 400 1rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .off { max-width: 30rem; display: grid; gap: 1.1rem; justify-items: center; }
    .off img { width: 132px; height: 33px; }
    .off h1 { margin: 0; font-size: 1.5rem; letter-spacing: -.01em; }
    .off p { margin: 0; color: rgba(255, 251, 247, .72); font-size: .95rem; }
    .off a {
      display: inline-block; padding: .7rem 1.3rem; border-radius: 999px; text-decoration: none;
      font-size: .92rem; font-weight: 600;
    }
    .off .go { background: #fffbf7; color: #1b0b0c; }
    .off .alt { border: 1px solid rgba(255, 251, 247, .35); color: #fffbf7; }
    .off nav { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="off">
    <img src="images/logo.png" alt="BrownHub">
    <h1>You are offline</h1>
    <p>No signal right now. Pages you have already opened in the app still work; anything new will load as soon as you are back online.</p>
    <nav>
      <a class="go" href="index.html">Back to home</a>
      <a class="alt" href="catalog.html">Catalog</a>
    </nav>
    <p>WhatsApp +233 50 295 4541 · howelldaniel533@gmail.com</p>
  </main>
</body>
</html>
